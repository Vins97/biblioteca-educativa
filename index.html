<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educativo - Material de Lectura e Investigación</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background-color: #1a5f7a; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1a5f7a; }
        .hidden-trigger { color: #888; font-size: 11px; cursor: pointer; margin-top: 50px; text-align: right; user-select: none; }
        
        #secret-chat { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; color: white; z-index: 99999; font-family: sans-serif; }
        .chat-header { background: #1f1f1f; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .close-btn { background: #ff4444; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        #messages { height: calc(100% - 130px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2a2a2a; padding: 10px; border-radius: 8px; max-width: 70%; width: fit-content; word-break: break-all; }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 4px; margin-top: 5px; display: block; }
        .chat-input-area { position: absolute; bottom: 0; width: 100%; background: #1f1f1f; padding: 15px; display: flex; gap: 10px; box-sizing: border-box; }
        .chat-input-area input[type="text"] { flex: 1; background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; }
        .send-btn, .file-btn { background: #1a5f7a; border: none; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .file-btn { background: #444; }
    </style>
</head>
<body>

    <!-- PORTADA DISFRAZ -->
    <div id="school-page">
        <header>
            <h1>Plataforma de Apoyo Académico v2.4</h1>
            <p>Recursos digitales para el desarrollo de proyectos de investigación</p>
        </header>
        <div class="container">
            <h2>📚 Guía de Uso del Portal</h2>
            <p>Este espacio contiene la bibliografía obligatoria para el trimestre en curso.</p>
            <div class="hidden-trigger" onclick="abrirChat()">Copyright © 2026 - Departamento de Soporte Técnico Educativo Integrado.</div>
        </div>
    </div>

    <!-- INTERFAZ DEL CHAT -->
    <div id="secret-chat">
        <div class="chat-header">
            <h3>Canal Anónimo (<span id="user-display"></span>)</h3>
            <button class="close-btn" onclick="cerrarChat()">X</button>
        </div>
        <div id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje anónimo..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button class="file-btn" onclick="document.getElementById('file-input').click()">📷</button>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="subirImagen(this)">
            <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        // ⚠️ PEGA TU URL DE FIREBASE AQUÍ RECUERDA EL /mensajes.json AL FINAL
        const DB_URL = "https://proyecto-escolar-base-default-rtdb.firebaseio.com/mensajes.json";
        
        let miUsuario = "";
        let esPrimeraCarga = true;
        let ID_UltimoMensaje = "";
        let bucleChat = null;

        function abrirChat() {
            // Solicitar apodo personalizado si no existe
            if (!miUsuario) {
                let apodo = prompt("Introduce tu apodo para esta sesión:", "Anónimo");
                miUsuario = apodo ? apodo.trim() : "Anónimo";
                document.getElementById('user-display').innerText = miUsuario;
            }

            // Solicitar permisos de notificación (Especialmente para Android)
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            document.getElementById('secret-chat').style.display = 'block'; 
            cargarMensajes();
            
            if(!bucleChat) {
                bucleChat = setInterval(cargarMensajes, 3000);
            }
        }

        function cerrarChat() { 
            document.getElementById('secret-chat').style.display = 'none'; 
        }

        function cargarMensajes() {
            fetch(DB_URL)
            .then(res => res.json())
            .then(data => {
                if(!data) return;
                const contenedor = document.getElementById('messages');
                contenedor.innerHTML = ""; 
                
                let llaves = Object.keys(data);
                let ultimaLlaveDetectada = llaves[llaves.length - 1];

                llaves.forEach(key => {
                    const msgData = data[key];
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg';
                    
                    if(msgData.tipo === 'texto') {
                        msgDiv.innerText = msgData.usuario + ": " + msgData.texto;
                    } else if(msgData.tipo === 'imagen') {
                        msgDiv.innerHTML = `<strong>${msgData.usuario}:</strong><br><img src="${msgData.url}">`;
                    }
                    contenedor.appendChild(msgDiv);
                });

                // Lógica de Notificaciones Dinámicas
                if (!esPrimeraCarga && ID_UltimoMensaje !== ultimaLlaveDetectada) {
                    const ultimoMsg = data[ultimaLlaveDetectada];
                    // Solo notifica si el mensaje es de la OTRA persona
                    if (ultimoMsg.usuario !== miUsuario) {
                        ejecutarNotificacion(ultimoMsg);
                    }
                }

                ID_UltimoMensaje = ultimaLlaveDetectada;
                esPrimeraCarga = false;
                contenedor.scrollTop = contenedor.scrollHeight;
            })
            .catch(err => console.error("Error al leer datos:", err));
        }

        function ejecutarNotificacion(msg) {
            if (Notification.permission === "granted") {
                let cuerpo = msg.tipo === 'texto' ? msg.texto : "📷 Ha enviado una imagen";
                new Notification(`Mensaje de ${msg.usuario}`, {
                    body: cuerpo,
                    icon: "https://github.com" // Icono genérico discreto
                });
                
                // Vibración en dispositivos Android compatibles
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200]);
                }
            }
        }

        function enviarMensaje() {
            const input = document.getElementById('msg-input');
            if(!input || input.value.trim() === "") return;

            const payload = {
                usuario: miUsuario,
                texto: input.value,
                tipo: 'texto',
                timestamp: Date.now()
            };

            fetch(DB_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(() => {
                input.value = "";
                cargarMensajes();
            })
            .catch(err => console.error(err));
        }

        function subirImagen(element) {
            const file = element.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onloadend = function() {
                const payload = {
                    usuario: miUsuario,
                    url: reader.result,
                    tipo: 'imagen',
                    timestamp: Date.now()
                };

                fetch(DB_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                })
                .then(() => cargarMensajes())
                .catch(err => console.error(err));
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
